name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Core on Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (100,000 people)
        run: ./build/bench 100000 16

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release -j
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

  windows-mingw:
    name: Windows (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: build.bat (builds everything and runs the tests)
        run: cmd //c build.bat
      - name: CMake + Ninja
        run: |
          cmake -S . -B build/ninja -G Ninja
          cmake --build build/ninja
          ctest --test-dir build/ninja --output-on-failure
